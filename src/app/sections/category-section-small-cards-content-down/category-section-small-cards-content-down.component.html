<div class="container px-3 sm:px-0 pb-14">
  <div
    class="block mb-1.5 flex justify-between"
    [ngStyle]="{ 'border-color': category.color }"
    *ngIf="category"
  >
    <a routerLink="{{ categorySlug }}">
      <h2
        class="font-semibold text-white text-[28px] capitalize"
        [ngStyle]="{ 'background-color': category.color }"
      >
        {{ category.name }}
      </h2>
    </a>
  </div>
  <swiper [slidesPerView]="4.5" [spaceBetween]="50" class="w-full">
    <ng-template swiperSlide *ngFor="let article of articleList">
      <app-card-small-content-down
        [articleData]="article"
      ></app-card-small-content-down>
    </ng-template>
  </swiper>
</div>
