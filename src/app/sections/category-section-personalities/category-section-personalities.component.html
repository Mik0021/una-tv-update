<div
  class="container lg:max-w-full lg:pl-[calc(50%-512px)] xl:pl-[calc(50%-640px)] 2xl:pl-[calc(50%-720px)] px-3 sm:px-0 pb-6 lg:pb-14"
>
  @if (category) {
    <div
      class="block mb-1.5 flex justify-between"
      [ngStyle]="{ 'border-color': category.color }"
    >
      <a routerLink="{{ categorySlug }}">
        <h2
          class="font-semibold text-white text-[28px] capitalize"
          [ngStyle]="{ 'background-color': category.color }"
        >
          {{ category.name }}
        </h2>
      </a>
    </div>
  }
  <swiper-container #carousel init="false" class="w-full">
    @for (article of articleList; track article) {
      <swiper-slide>
        <app-personality-home-card
          [articleData]="article"
        ></app-personality-home-card>
      </swiper-slide>
    }
  </swiper-container>
</div>
