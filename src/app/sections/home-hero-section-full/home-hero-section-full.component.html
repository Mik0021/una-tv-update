<section
  class="bg-dark pb-6 lg:pb-14 mt-[66px] sm:mt-[79px] lg:mt-0 relative 2xl:max-w-[1920px] 2xl:mx-auto"
>
  @if (hero(); as hero) {
    <a
      class="container lg:max-w-full relative block aspect-video max-h-[750px] lg:after:absolute lg:after:inset-0 lg:after:bg-gradient-to-b lg:after:from-transparent lg:after:to-black lg:after:opacity-50"
      routerLink="{{ articleSlug() }}"
    >
      @if (hero.image) {
        <img
          class="w-full h-full object-cover object-top"
          src="{{ hero.image.url }}"
          srcset="{{ srcSet() }}"
          sizes="100vw"
          [alt]="
            hero.image.description ? hero.image.description : hero.image.name
          "
        />
      }
      <div class="container lg:absolute inset-0 mt-4 lg:mt-0 px-3 sm:px-0 z-10">
        @if (hero.tv_category) {
          <div class="lg:absolute lg:bottom-0 lg:pb-20 lg:left-0 lg:right-2/3">
            @if (hero) {
              <p class="text-3xl text-white font-bold mb-3">
                {{ hero.sub_title }}
              </p>
            }
            @if (hero) {
              <h1
                class="text-2xl sm:text-5xl text-white font-bold mb-3 lg:mb-0"
              >
                {{ hero.title }}
              </h1>
            }
          </div>
        }
      </div>
    </a>
  }
</section>
