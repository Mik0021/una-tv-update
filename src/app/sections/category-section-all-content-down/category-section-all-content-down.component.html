<div class="container px-3 sm:px-0 pb-14">
  <div
    class="block border-b-blue border-b-4 mb-14 flex justify-between"
    *ngIf="category"
    [ngStyle]="{ 'border-color': category.color }"
  >
    <a routerLink="{{ categorySlug }}">
      <h2
        class="font-semibold inline-block text-black bg-blue px-12 py-1 uppercase items-center mb-0"
        [ngStyle]="{ 'background-color': category.color }"
      >
        {{ category.name }}
      </h2>
    </a>
    <a
      routerLink="{{ categorySlug }}"
      [ngStyle]="{ color: category.color }"
      class="text-blue uppercase font-semibold hover:scale-110 hover:-rotate-6 transition-transform"
      >Više</a
    >
  </div>
  <div class="grid grid-cols-2 lg:grid-cols-4 lg:grid-rows-2 gap-5">
    <app-card-large-content-down
      [articleData]="articleList[0]"
    ></app-card-large-content-down>
    <app-card-small-content-down
      [articleData]="articleList[1]"
    ></app-card-small-content-down>
    <app-card-small-content-down
      [articleData]="articleList[2]"
    ></app-card-small-content-down>
    <app-card-small-content-down
      [articleData]="articleList[3]"
    ></app-card-small-content-down>
    <app-card-small-content-down
      [articleData]="articleList[4]"
    ></app-card-small-content-down>
  </div>
</div>
