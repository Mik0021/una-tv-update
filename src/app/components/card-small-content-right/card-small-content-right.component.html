<a
  *ngIf="articleData"
  routerLink="{{ articleSlug }}"
  class="grid grid-cols-4 sm:grid-cols-3 gap-5"
>
  <div
    class="relative col-span-2 sm:col-auto aspect-video"
    *ngIf="articleData.images[0]"
  >
    <img
      class="w-full h-full object-cover object-top aspect-video"
      [src]="articleData.images[0].url"
      [alt]="articleData.images[0].name"
    />
    <div class="absolute left-2 bottom-0 z-30">
      <app-notification-icons-small
        [image]="hasImage"
        [video]="hasVideo"
        [timeline]="isTimeline"
      ></app-notification-icons-small>
    </div>
  </div>
  <div class="col-span-2">
    <h2 class="text-white text-[22px] leading-7 font-semibold mb-3.5">
      {{ articleData.title }}
    </h2>
    <p class="text-white hidden md:line-clamp-3">
      {{ articleData.short_description }}
    </p>
  </div>
</a>
