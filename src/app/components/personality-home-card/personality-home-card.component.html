@if (articleData(); as personality) {
  <a routerLink="/nasa-lica/{{ personality.slug }}" class="card-hover">
    @if (personality.image) {
      <div class="relative aspect-video">
        <img
          class="w-full h-full object-cover object-top aspect-video"
          src="{{ personality.image.url }}"
          srcset="{{ srcSet() }}"
          sizes="(min-width: 340px) 50vw, 20vw"
          [alt]="
            personality.image.description
              ? personality.image.description
              : personality.image.name
          "
        />
        <div
          class="absolute inset-0 flex flex-col justify-end p-3.5 z-30 text-white bg-gray-dark opacity-0 card-image transition-opacity border-l-2 border-blue"
        >
          <!-- <h5>{{ personality.category.name }}</h5> -->
          <p>{{ personality.sub_title }}</p>
        </div>
      </div>
    }
    <h2
      class="text-white font-semibold my-3.5 text-lg sm:text-[22px] leading-7 card-title transition-colors"
    >
      {{ personality.name }}
    </h2>
  </a>
}
