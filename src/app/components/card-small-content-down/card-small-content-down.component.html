<a class="inline-block" *ngIf="articleData" routerLink="{{ articleSlug }}">
  <div class="relative aspect-video" *ngIf="articleData.images[0]">
    <img
      class="w-full h-full object-cover object-top aspect-video"
      [src]="articleData.images[0].url"
      [alt]="articleData.images[0].name"
    />
    <div class="absolute left-2 bottom-0 z-30">
      <app-notification-icons-small
        [image]="hasImage"
        [video]="hasVideo"
        [timeline]="isTimeline"
      ></app-notification-icons-small>
    </div>
  </div>
  <h4
    class="font-bold pl-3 mb-2.5 mt-3.5 text-xs uppercase text-white relative before:bg-white before:absolute before:left-0 before:h-full before:w-1"
  >
    <a routerLink="{{ categorySlug }}">{{ articleData.category.name }}</a>
  </h4>
  <h2 class="text-white font-semibold mb-3.5 text-[22px] leading-7">
    {{ articleData.title }}
  </h2>
</a>
