<a *ngIf="articleData" routerLink="{{ articleSlug }}" class="card-hover">
  <div class="relative aspect-video" *ngIf="articleData.images[0]">
    <img
      class="w-full h-full object-cover object-top aspect-video"
      src="{{ articleData.images[0].url }}"
      srcset="{{ srcSet }}"
      sizes="(min-width: 340px) 50vw, 20vw"
      [alt]="
        articleData.images[0].description
          ? articleData.images[0].description
          : articleData.images[0].name
      "
    />
    <div
      class="absolute inset-0 flex flex-col justify-end p-3.5 z-30 text-white bg-gray-dark opacity-0 card-image transition-opacity border-l-2 border-blue"
    >
      <h5>{{ articleData.category.name }}</h5>
      <p>{{ articleData.short_description }}</p>
    </div>
  </div>

  <h2
    class="text-white font-semibold my-3.5 text-[22px] leading-7 card-title transition-colors"
  >
    {{ articleData.title }}
  </h2>
</a>
