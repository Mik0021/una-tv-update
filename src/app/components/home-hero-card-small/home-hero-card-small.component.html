<a routerLink="{{ articleSlug }}" class="z-30" *ngIf="articleData">
  <div
    class="after:absolute after:inset-0 after:bg-gradient-to-b after:from-transparent after:to-black after:opacity-60 relative aspect-video w-full"
    *ngIf="articleData.images[0]"
  >
    <img
      class="w-full h-full object-cover object-top aspect-video"
      [src]="articleData.images[0].url"
      [alt]="articleData.images[0].name"
    />
  </div>
  <div class="sm:absolute bottom-2.5 inset-x-5 z-20 pt-1 sm:pt-7 sm:pt-0">
    <app-notification-icons-small
      [image]="hasImage"
      [video]="hasVideo"
      [timeline]="isTimeline"
    ></app-notification-icons-small>
    <h4
      class="font-bold pl-3 mb-1.5 text-xs uppercase text-white relative before:bg-white before:absolute before:left-0 before:h-full before:w-1"
    >
      <a routerLink="{{ categorySlug }}">{{ articleData.category.name }}</a>
    </h4>
    <h2 class="text-white font-semibold text-lg leading-6">
      {{ articleData.title }}
    </h2>
  </div>
</a>
