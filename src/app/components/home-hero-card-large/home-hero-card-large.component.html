<a
  routerLink="{{ articleSlug }}"
  class="z-30 after:absolute after:inset-0 after:bg-gradient-to-b after:from-transparent after:to-black after:opacity-60 block relative w-full h-full aspect-video"
  *ngIf="articleData"
>
  <!-- <img
    class="h-full w-full object-cover object-top aspect-video"
    [src]="articleData.images[0].url"
    [alt]="articleData.images[0].name"
    *ngIf="articleData.images[0]"
  /> -->
  <img
    class="h-full w-full object-cover object-top aspect-video"
    src="{{ articleData.images[0].url }}"
    srcset="{{srcSet}}"
    sizes="(min-width: 1024px) 100vw, 50vw"
    [alt]="
      articleData.images[0].description
        ? articleData.images[0].description
        : articleData.images[0].name
    "
    *ngIf="articleData.images[0]"
  />

  <div class="absolute bottom-1 sm:bottom-2.5 inset-x-1 sm:inset-x-5 z-20">
    <app-notification-icons
      [image]="hasImage"
      [video]="hasVideo"
      [timeline]="isTimeline"
    ></app-notification-icons>
    <h4
      class="font-bold pl-3 mb-1.5 text-xs uppercase text-white relative before:bg-white before:absolute before:left-0 before:h-full before:w-1"
    >
      <a routerLink="{{ categorySlug }}">{{ articleData.category.name }}</a>
    </h4>
    <h1 class="text-white font-semibold">
      {{ articleData.title }}
    </h1>
  </div>
</a>
