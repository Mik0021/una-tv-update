<nav class="pb-14">
  <ul
    class="flex flex-col items-center sm:flex-row sm:justify-center text-base font-bold uppercase flex-wrap gap-4"
  >
    @for (item of navList()?.data; track item) {
      <li class="text-white hover:text-blue transition-colors">
        <a routerLink="/{{ item.slug }}">{{ item.title }}</a>
      </li>
    }
  </ul>
</nav>
