<div class="container px-3 sm:px-0">
  <div class="flex justify-between relative">
    <div class="flex">
      <a routerLink="" class="self-center py-3 no-tap-color">
        <img
          class="w-24 sm:w-auto"
          src="./assets/images/logo.png"
          width="124"
          height="55"
          alt="Logo"
        />
      </a>
      <nav
        class="pl-3 lg:pl-14 fixed inset-0 lg:static lg:flex items-center z-50 overflow-auto lg:overflow-visible transition-transform lg:translate-x-0"
        [ngClass]="isMenuShown"
      >
        <div class="flex justify-between lg:hidden mb-7">
          <a routerLink="" class="self-center py-3 no-tap-color"
            ><img
              class="w-24 sm:w-auto"
              src="./assets/images/logo.png"
              alt="Logo"
          /></a>
          <button class="mr-3 no-tap-color" (click)="onMenuClose()">
            <svg
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              class="fill-white"
            >
              <path
                d="M17.18 0L10 7.18L2.82 0L0 2.82L7.18 10L0 17.18L2.82 20L10 12.82L17.18 20L20 17.18L12.82 10L20 2.82L17.18 0Z"
              />
            </svg>
          </button>
        </div>
        <ul
          class="uppercase flex flex-col lg:flex-row lg:gap-7 lg:items-center"
        >
          <li
            class="mb-4 lg:mb-0 lg:py-10 relative menu-item pr-20 lg:pr-0 text-white no-tap-color"
            *ngFor="let item of navList.data"
            [ngStyle]="{ color: item.color }"
          >
            <a
              class="hover:text-blue transition-colors"
              routerLink="/{{ item.slug }}"
              routerLinkActive="active"
              (click)="onMenuClose()"
              >{{ item.title }}</a
            >
            <app-header-submenu
              *ngIf="item.children.length > 0"
              [subcategory]="item.children"
              (isMenuShown)="closeFromSubmenu($event)"
            ></app-header-submenu>
          </li>
          <li
            class="mb-4 lg:mb-0 relative menu-item pr-20 lg:pr-0 text-black no-tap-color lg:ml-6"
          >
            <a
              class="hover:text-white transition-colors block bg-blue px-5 py-3.5 font-semibold rounded-[4px] leading-5"
              href="https://unaworld.com/"
              >UNA WORLD</a
            >
          </li>
        </ul>
      </nav>
    </div>
    <div class="flex">
      <app-header-search></app-header-search>
      <!-- <app-header-select-site></app-header-select-site> -->
      <button
        class="lg:hidden ml-3 sm:ml-9 no-tap-color"
        (click)="onMenuOpen()"
      >
        <svg
          width="27"
          height="21"
          viewBox="0 0 27 21"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          class="fill-white"
        >
          <path
            d="M0 0.96875H26.6667V4.25689H0V0.96875ZM0 9.1891H26.6667V12.4772H0V9.1891ZM0 17.4094H26.6667V20.6976H0V17.4094Z"
          />
        </svg>
      </button>
    </div>
  </div>
</div>
