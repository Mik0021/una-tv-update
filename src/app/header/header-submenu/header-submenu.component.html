<ul
  class="submenu z-50 overflow-hidden max-h-0 lg:max-h-screen lg:py-3 lg:absolute bg-gray-dark pl-10 lg:px-4 lg:top-full lg:right-1/2 lg:min-w-[10rem] lg:translate-x-2/4 lg:hidden shadown-none lg:opacity-9"
  [ngClass]="submenuHide"
>
  <button
    class="absolute top-2 right-10 ml-10 lg:hidden"
    (click)="onCollapseSubmenu()"
  >
    <svg
      width="19"
      height="11"
      viewBox="0 0 19 11"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      class="stroke-neutral-100 rotate-180"
    >
      <path
        d="M2 9L9.5 1.9763L17 9"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
  @for (subItem of subcategory; track subItem) {
    <li
      class="mb-4 last:mb-0 transition-colors text-white"
      [ngStyle]="{ color: subItem.color }"
    >
      <a
        class="hover:text-blue"
        routerLink="/{{ subItem.slug }}"
        (click)="onMenuClose()"
      >
        {{ subItem.title }}
      </a>
    </li>
  }
</ul>
