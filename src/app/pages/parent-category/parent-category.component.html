<section class="bg-dark my-14">
  <div class="container px-3 sm:px-0" *ngIf="category.data">
    <div
      class="block border-b-blue border-b-4 mb-14 flex justify-between"
      [ngStyle]="{ 'border-color': category.data.category.color }"
    >
      <h2
        class="font-semibold inline-block text-black bg-blue px-12 py-1 uppercase items-center mb-0"
        [ngStyle]="{ 'background-color': category.data.category.color }"
      >
        {{ category.data.category.name }}
      </h2>
    </div>
    <div
      class="grid grid-cols-2 lg:grid-cols-4 lg:grid-rows-2 gap-5 mb-1.5"
      *ngIf="p === 1"
    >
      <app-card-large-content-down
        *ngIf="promoArticles[0] && p === 1"
        [articleData]="promoArticles[0]"
      ></app-card-large-content-down>
      <app-card-small-content-down
        *ngFor="let article of promoArticles | slice: 1"
        [articleData]="article"
      ></app-card-small-content-down>
    </div>
    <div class="grid grid-cols-2 lg:grid-cols-4 lg:grid-rows-2 gap-5">
      <app-card-small-content-down
        *ngFor="
          let article of articles
            | paginate
              : {
                  itemsPerPage: 24,
                  currentPage: p,
                  totalItems: paginator.total
                }
        "
        [articleData]="article"
      ></app-card-small-content-down>
    </div>
    <div class="grid place-items-center mt-28" *ngIf="paginator.last_page > 1">
      <pagination-controls
        class="pagination"
        (pageChange)="getPage($event)"
        previousLabel=""
        nextLabel=""
      ></pagination-controls>
    </div>
  </div>
</section>
