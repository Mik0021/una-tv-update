<section class="bg-dark mt-[66px] sm:mt-[79px] lg:mt-[104px] mb-6 lg:mb-14">
  <div class="container">
    <div class="grid grid-cols-12 pb-8" *ngIf="!isTvLice">
      <div
        class="col-span-12 xl:pr-4 px-3 sm:px-0 text-lg selection:bg-blue"
        *ngIf="single_post.data"
      >
        <div
          class="w-full relative image-gradient mb-6 lg:mb-14"
          *ngIf="images[0]"
        >
          <img
            class="w-full"
            src="{{ images[0].url }}"
            srcset="{{ srcSet }}"
            sizes="(min-width: 1280px) 100vw, 70vw"
            [alt]="
              images[0].description ? images[0].description : images[0].name
            "
          />
          <!-- <span
          class="absolute bg-blue bottom-0 left-0 px-2 py-1 text-sm"
          *ngIf="images[0].source"
        >
          Foto: <span class="font-bold">{{ images[0].source }}</span>
        </span> -->
          <div
            class="absolute left-10 top-1/2 z-10 -translate-y-1/2 Lg:right-2/3 hidden lg:block"
          >
            <p class="text-white text-2xl font-bold">
              {{ single_post.data.short_description }}
            </p>
            <h1
              class="text-white font-bold text-3xl sm:text-[42px] pb-4 lg:leading-[48px]"
            >
              {{ single_post.data.title }}
            </h1>
          </div>
        </div>
        <!-- <div *ngIf="images[0].description">
          <i class="text-white text-xs leading-none block pl-2 pt-1">
            {{ images[0].description }}
          </i>
        </div> -->

        <div class="grid grid-cols-12">
          <div
            class="col-span-12 lg:col-span-8 lg:border-r-2 lg:border-white lg:pr-9"
          >
            <p class="text-white text-lg">
              {{ single_post.data.short_description }}
            </p>
            <h3
              class="text-white font-bold text-xl sm:text-[42px] pb-4 leading-[48px]"
            >
              {{ single_post.data.title }}
            </h3>

            <div
              class="sp-content text-white text-xl mt-0 lg:mt-6"
              [innerHTML]="content | safeHtml"
              appRunScripts
            ></div>
            <div class="flex text-white text-lg pb-4 gap-x-1">
              <div *ngIf="tags_list.length !== 0">
                <div>
                  <span
                    class="block"
                    *ngIf="tags_list.length > 1; else elseBlock"
                    >TV Lica:
                  </span>
                  <ng-template class="block" #elseBlock>TV Lice: </ng-template>
                </div>
                <div>
                  <a
                    routerLink="/nasa-lica/{{ author.slug }}"
                    class="after:content-[','] after:m-0 last:after:content-[''] font-semibold text-xl hover:text-blue transition-colors"
                    *ngFor="let author of tags_list"
                  >
                    {{ author.name }}</a
                  >
                </div>
              </div>
            </div>
          </div>
          <div class="col-span-12 lg:col-span-4 lg:pl-9">
            <!-- <h3 class="text-2xl font-bold text-white opacity-70 mb-7">
              60 min
            </h3> -->
            <app-single-social></app-single-social>
          </div>
        </div>
        <!-- <div>
          <h2 class="text-2xl font-semibold text-white mb-3">Sve epizode:</h2>
          <div class="grid grid-cols-2 lg:grid-cols-4 lg:grid-rows-2 gap-5">
            <app-card-small-content-down
              *ngFor="let article of conected_articles"
              [articleData]="article"
            ></app-card-small-content-down>
          </div>
        </div> -->
      </div>
    </div>
  </div>
</section>
