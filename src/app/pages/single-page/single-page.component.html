<section class="bg-dark mt-[66px] sm:mt-[79px] lg:mt-[104px] mb-6 lg:mb-14">
  <div class="container">
    <div class="grid grid-cols-12 pb-8">
      <div
        class="col-span-12 xl:pr-4 px-3 text-lg selection:bg-blue"
        *ngIf="single_post.data"
      >
        <div
          class="video-outer aspect-video w-full"
          *ngIf="single_post.data.brid_video_id"
        >
          <div
            class="video-container w-full mb-3"
            [ngClass]="{ scrolled: windowScrolled }"
            [innerHTML]="singleVideo | safeHtml"
            appRunScripts
          ></div>
        </div>
        <div *ngIf="!single_post.data.brid_video_id">
          <div
            class="w-full relative image-gradient mb-6 lg:mb-14"
            *ngIf="image && !single_post.data.brid_video_id"
          >
            <img
              class="w-full"
              src="{{ image.url }}"
              srcset="{{ srcSet }}"
              sizes="(min-width: 1280px) 100vw, 70vw"
              [alt]="image.description ? image.description : image.name"
            />
          </div>
        </div>

        <div class="grid grid-cols-12">
          <div
            class="col-span-12 lg:col-span-8 lg:border-r-2 lg:border-white lg:pr-9"
          >
            <p class="text-white text-lg">
              {{ single_post.data.sub_title }}
            </p>
            <h1
              class="text-white font-bold text-xl sm:text-[42px] pb-4 leading-[48px]"
            >
              {{ single_post.data.title }}
            </h1>

            <div
              class="sp-content text-white text-xl mt-0 lg:mt-6"
              [innerHTML]="content | safeHtml"
              appRunScripts
            ></div>
            <div class="flex text-white text-lg pb-4 gap-x-1">
              <div *ngIf="personalities.length !== 0">
                <div>
                  <span
                    class="block"
                    *ngIf="personalities.length > 1; else elseBlock"
                    >Naša lica:
                  </span>
                  <ng-template class="block" #elseBlock
                    >Naše lice:
                  </ng-template>
                </div>
                <div>
                  <a
                    routerLink="/nasa-lica/{{ personality.slug }}"
                    class="after:content-[','] after:m-0 last:after:content-[''] font-semibold text-xl hover:text-blue transition-colors"
                    *ngFor="let personality of personalities"
                  >
                    {{ personality.name }}</a
                  >
                </div>
              </div>
            </div>
          </div>
          <div class="col-span-12 lg:col-span-4 lg:pl-9">
            <h3 class="text-2xl font-bold text-white opacity-70 mb-7">
              {{ duration }} min
            </h3>
            <app-single-social></app-single-social>
          </div>
        </div>
        <div class="w-full mt-7">
          <app-single-tags
            *ngIf="tags_list.length > 0"
            [tags]="tags_list"
          ></app-single-tags>
        </div>
      </div>
    </div>
    <ng-container *ngIf="episodes.length > 0" class="mt-7">
      <h2 class="text-3xl text-white font-semibold mb-3">Epizode:</h2>
      <div class="grid gap-5 grid-cols-2 lg:grid-cols-4">
        <app-card-small-content-down
          *ngFor="
            let episode of episodes
              | paginate
                : {
                    itemsPerPage: 24,
                    currentPage: p,
                    totalItems: episodes.length
                  }
          "
          [articleData]="episode"
        ></app-card-small-content-down>
      </div>
      <div class="grid place-items-center mt-28" *ngIf="episodes.length > 24">
        <pagination-controls
          class="pagination"
          (pageChange)="getPage($event)"
          previousLabel=""
          nextLabel=""
        ></pagination-controls>
      </div>
    </ng-container>
  </div>
</section>
