<section class="bg-dark mb-14 mt-60">
  @if (staticPage.data) {
    <div class="container px-3 sm:px-0">
      <h1
        class="text-white font-bold text-3xl sm:text-[42px] pb-4 leading-[3rem]"
        >
        {{ staticPage.data.title }}
      </h1>
      <div
        class="sp-content text-white text-lg"
        [innerHTML]="staticPage.data.description"
      ></div>
    </div>
  }
</section>
