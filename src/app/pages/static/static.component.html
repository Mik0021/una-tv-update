<section class="bg-dark my-14">
  <div class="container px-3 sm:px-0" *ngIf="staticPage.data">
    <h1 class="text-white font-bold text-3xl sm:text-[42px] pb-4">
      {{ staticPage.data.title }}
    </h1>
    <div
      class="sp-content text-white text-lg"
      [innerHTML]="staticPage.data.description"
    ></div>
  </div>
</section>
