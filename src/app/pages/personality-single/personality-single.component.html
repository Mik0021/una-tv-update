<section class="bg-dark mt-[66px] sm:mt-[79px] lg:mt-[104px] mb-6 lg:mb-14">
  <div class="container">
    <div class="max-w-[900px] mx-auto px-2">
      @if (data()?.data; as personality) {
        <div class="flex items-center flex-wrap lg:flex-nowrap">
          @if (personality.image) {
            <div class="relative aspect-video h-48">
              <img
                class="w-full h-full object-cover object-top aspect-video"
                src="{{ personality.image.url }}"
                sizes="(min-width: 1280px) 100vw, 70vw"
                [alt]="
                  personality.image.description
                    ? personality.image.description
                    : personality.image.name
                "
              />
            </div>
          }
          <div
            class="flex items-center justify-between lg:ml-20 border-b-2 border-blue backgroud-title flex-grow"
          >
            <div class="lg:pl-5 py-6">
              <h1 class="font-bold text-4xl text-white">
                {{ personality.name }}
              </h1>
              <h2 class="font-bold text-2xl text-white">
                {{ personality.sub_title }}
              </h2>
            </div>
            <div class="lg:pl-4">
              <img
                height="100"
                width="128"
                src="./assets/images/logo.png"
                alt=""
              />
            </div>
          </div>
        </div>
      }
      <app-html-embed
        [html]="data()?.data?.description ?? ''"
        contentClass="sp-content text-white text-xl mt-0 lg:mt-6"
      />
    </div>
    @if (shows().length > 0) {
      <ng-container class="mt-7">
        <h2 class="text-3xl text-white font-semibold mb-3">Emisije:</h2>
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-5">
          @for (show of shows(); track show) {
            <app-card-small-content-down [articleData]="show" />
          }
        </div>
      </ng-container>
    }
  </div>
</section>
