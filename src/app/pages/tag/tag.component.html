<section class="bg-dark mb-14 mt-60">
  <div class="container px-3 sm:px-0">
    <div class="block border-b-blue border-b-4 mb-14 flex justify-between">
      <h2
        class="font-semibold inline-block text-black bg-blue px-12 py-1 uppercase items-center mb-0"
      >
        {{ data()?.data?.tv_tag?.name }}
      </h2>
    </div>
    <div class="grid grid-cols-2 lg:grid-cols-4 lg:grid-rows-2 gap-5">
      @for (
        article of data()?.data?.tv_shows ?? []
          | paginate
            : {
                itemsPerPage: 24,
                currentPage: p(),
                totalItems: data()?.paginator?.total,
              };
        track article
      ) {
        <app-card-small-content-down [articleData]="article" />
      }
    </div>
    @if ((data()?.paginator?.last_page ?? 0) > 1) {
      <div class="grid place-items-center mt-28">
        <pagination-controls
          class="pagination"
          (pageChange)="getPage($event)"
          previousLabel=""
          nextLabel=""
        />
      </div>
    }
  </div>
</section>
