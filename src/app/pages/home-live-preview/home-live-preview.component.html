<app-home-hero-section-full
  *ngIf="heroType === 2"
  [articles]="heroArticleList"
></app-home-hero-section-full>

<app-home-hero-section
  *ngIf="heroType === 1"
  [articles]="heroArticleList"
></app-home-hero-section>

<section
  *ngFor="let section of heroSection.data"
  [ngSwitch]="section.article_template.id"
  class="bg-dark pb-14"
>
  <app-category-section-all-content-down
    [sectionData]="section"
    *ngSwitchCase="3"
  ></app-category-section-all-content-down>

  <app-category-section-content-right
    [sectionData]="section"
    *ngSwitchCase="4"
  ></app-category-section-content-right>

  <app-category-section-double-large-content-down
    [sectionData]="section"
    *ngSwitchCase="5"
  ></app-category-section-double-large-content-down>

  <app-category-section-small-cards-content-down
    [sectionData]="section"
    *ngSwitchCase="6"
  ></app-category-section-small-cards-content-down>
</section>
