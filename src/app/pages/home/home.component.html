<app-home-hero-section-full
  *ngIf="heroType === 2"
  [articles]="heroArticleList"
></app-home-hero-section-full>

<app-home-hero-section
  *ngIf="heroType === 1"
  [articles]="heroArticleList"
></app-home-hero-section>

<section
  *ngFor="let section of heroSection.data"
  class="bg-dark container-slider"
>
  <app-category-section-small-cards-content-down
    [sectionData]="section"
    *ngIf="
      section.article_template.id === 3 ||
      section.article_template.id === 4 ||
      section.article_template.id === 5 ||
      section.article_template.id === 6
    "
  ></app-category-section-small-cards-content-down>
</section>
