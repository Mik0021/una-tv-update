@if (heroType() === 1) {
  <app-home-hero-section-full [articles]="heroArticles()" />
}

@for (section of home()?.data; track section) {
  <section class="bg-dark container-slider">
    @if (
      section.tv_show_template.type_id === 2 && section.tv_shows.length > 0
    ) {
      <app-category-section-small-cards-content-down [sectionData]="section" />
    }
    @if (
      section.tv_show_template.type_id === 2 &&
      section.tv_personalities.length > 0
    ) {
      <app-category-section-personalities [sectionData]="section" />
    }
  </section>
}
