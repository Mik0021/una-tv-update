<div class="overflow-x-auto">
  <div class="block min-w-[600px]">
    <div class="tabs">
      <ul class="tab-group">
        <li
          *ngFor="let tab of tabs; index as i"
          class="tab"
          [class.active]="tab.active"
          (click)="changeTab(i)"
        >
          {{ tab.title }}
        </li>
      </ul>
      <div class="tab-content-group">
        <ng-container *ngFor="let tab of tabs">
          <div
            class="tab-content"
            *ngIf="tab.active"
            [innerHTML]="tab.content"
          ></div>
        </ng-container>
      </div>
    </div>
