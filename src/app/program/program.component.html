<section class="bg-dark mb-14 mt-[76px] sm:mt-[89px] lg:mt-[124px]">
  <div class="container px-3 sm:px-0">
    <div class="mx-auto">
      <h1 class="text-white font-bold text-2xl md:text-4xl mb-3 text-center">
        Programska šema
      </h1>
      <div class="flex justify-center text-white gap-5">
        <button
          (click)="showTab = false"
          [ngClass]="!showTab ? 'text-blue' : ''"
        >
          BiH</button
        ><button
          (click)="showTab = true"
          [ngClass]="showTab ? 'text-blue' : ''"
        >
          RS
        </button>
      </div>
      <div *ngIf="showTab">
        <app-table [schema]="schemaComplete"></app-table>
      </div>
      <div *ngIf="!showTab">
        <h2 class="text-white">program za bih</h2>
      </div>
    </div>
  </div>
</section>
